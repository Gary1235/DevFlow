name: Verify DevFlow
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: dotnet build DevFlow.slnx
        working-directory: backend
      - run: dotnet test DevFlow.slnx --no-build --no-restore
        working-directory: backend
      - run: node --test scripts/runtime.test.mjs desktop/test/*.test.cjs
